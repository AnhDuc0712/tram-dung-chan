[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, gdlintrc, assets/audio/music/*, assets/art/chars/*_x_*"
export_path="../build/tram-dung-chan/index.html"

[preset.1.options]

variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<meta name=\"theme-color\" content=\"#1c1418\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"description\" content=\"Trạm Dừng Chân — game tình cảm ở quán cà phê Gờ 23. Tập 1: Cú va chạm · Tập 2: Cơn bão nhỏ.\">
<style>html,body{background:#1c1418;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style>
<script>document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement&&screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}});</script>
<style>#tdc-load{position:absolute;left:0;right:0;bottom:calc(10% + 22px);text-align:center;color:#f3dfd2;font:600 15px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;letter-spacing:.02em;text-shadow:0 1px 3px #000;pointer-events:none}#tdc-hint{position:absolute;left:16px;right:16px;bottom:calc(10% - 34px);text-align:center;color:#d9bfb0;font:400 13px/1.4 system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}#status-progress{accent-color:#e58fa3;height:10px}</style>
<script>window.addEventListener('DOMContentLoaded',function(){var st=document.getElementById('status'),pr=document.getElementById('status-progress');if(!st||!pr)return;var t=document.createElement('div');t.id='tdc-load';t.textContent='Đang mở Trạm Dừng Chân…';st.appendChild(t);var h=document.createElement('div');h.id='tdc-hint';h.textContent='Lần đầu tải hơi lâu (khoảng 16 MB) — các lần sau mở nhanh hơn nhiều vì trình duyệt đã nhớ.';st.appendChild(h);var t0=Date.now();var iv=setInterval(function(){if(!document.body.contains(st)){clearInterval(iv);return;}var v=pr.value,m=pr.max;if(pr.hasAttribute('max')&&m>0&&v<m){t.textContent='Đang tải trò chơi… '+Math.floor(v*100/m)+'%';}else if(pr.hasAttribute('max')&&m>0){t.textContent='Sắp xong, đang khởi động…';}if(Date.now()-t0>12000){h.textContent='Mạng hơi chậm — game vẫn đang tải, đừng tắt trang nhé!';}},150);});</script>"
progressive_web_app/enabled=false

