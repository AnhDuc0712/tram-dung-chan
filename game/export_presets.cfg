[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, gdlintrc"
export_path="../build/windows/TramDungChan.exe"

[preset.0.options]

binary_format/embed_pck=true
application/modify_resources=false
application/product_name="Trạm Dừng Chân"

[preset.1]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="*.json"
exclude_filter="tests/*, addons/gut/*, gdlintrc"
export_path="../build/tram-dung-chan/index.html"

[preset.1.options]

variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
html/head_include="<meta name=\"theme-color\" content=\"#1c1418\">
<meta name=\"mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">
<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">
<meta name=\"description\" content=\"Trạm Dừng Chân — game tình cảm ở quán cà phê Gờ 23. Tập 1: Cú va chạm ở quán cà phê.\">
<style>html,body{background:#1c1418;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}</style>
<script>document.addEventListener('fullscreenchange',function(){if(document.fullscreenElement&&screen.orientation&&screen.orientation.lock){screen.orientation.lock('landscape').catch(function(){});}});</script>"
progressive_web_app/enabled=false
